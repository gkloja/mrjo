services:
  - type: web
    name: site-marinha
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      
      # Headers CORS para permitir carregamento de recursos externos
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      
      - path: /*
        name: Access-Control-Allow-Methods
        value: "GET, POST, OPTIONS"
      
      - path: /*
        name: Access-Control-Allow-Headers
        value: "Content-Type, Authorization"
      
      - path: /*
        name: Access-Control-Allow-Credentials
        value: "true"
      
      # Permite carregar recursos de domínios específicos
      - path: /*
        name: Content-Security-Policy
        value: "default-src * self blob: data:; media-src * self blob: data: http://br2.bronxyshost.com:4009 https://br2.bronxyshost.com:4009; connect-src * self; script-src * self 'unsafe-inline' 'unsafe-eval'; style-src * self 'unsafe-inline'; img-src * self data: blob:; font-src * self data:;"
