<script>
    // ==================== CONFIGURAÇÃO ====================
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    
    let currentUrl = DEFAULT_URL;
    let loadTimeout = null;
    
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const loader = document.getElementById('loader');
    
    // ==================== FUNÇÕES ====================
    function showLoader(show) {
        if (show) {
            loader.classList.add('show');
            if (loadTimeout) clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                if (loader.classList.contains('show')) {
                    showLoader(false);
                }
            }, 10000);
        } else {
            loader.classList.remove('show');
            if (loadTimeout) {
                clearTimeout(loadTimeout);
                loadTimeout = null;
            }
        }
    }
    
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        
        // Adicionar https:// se não tiver
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        showLoader(true);
        currentUrl = finalUrl;
        urlInput.value = finalUrl;
        
        const proxyUrl = PROXY_SERVICE + encodeURIComponent(finalUrl);
        
        iframe.onload = function() {
            showLoader(false);
        };
        
        iframe.onerror = function() {
            showLoader(false);
            console.error('Erro ao carregar:', finalUrl);
        };
        
        iframe.src = proxyUrl;
        
        // Atualizar URL
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
    }
    
    function resetToHome() {
        carregarUrl(DEFAULT_URL);
    }
    
    function toggleFullscreen() {
        const container = document.getElementById('iframeContainer');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                console.log('Erro fullscreen:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // ==================== EVENTOS ====================
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    // ==================== INICIAR ====================
    function init() {
        let startUrl = getUrlFromParams();
        if (!startUrl) startUrl = DEFAULT_URL;
        
        urlInput.value = startUrl;
        carregarUrl(startUrl);
        
        // Recarregar anúncios periodicamente
        setInterval(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 20000);
    }
    
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>
