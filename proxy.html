    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Iframe ocupa a tela TODA - igual site real */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            z-index: 1;
        }

        /* Loader centralizado */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: none;
        }

        .loader.show {
            display: block;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #003366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Iframe do proxy - tela cheia -->
    <iframe id="proxyFrame" src="about:blank"></iframe>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <script>
        // URL padrão (G1)
        const DEFAULT_URL = 'https://g1.globo.com/';
        
        // Serviço proxy
        const PROXY_SERVICE = 'https://cors.eu.org/';
        
        let currentUrl = DEFAULT_URL;
        
        // Função para extrair nome do site da URL
        function getSiteName(url) {
            try {
                if (!url) return "Web Proxy";
                
                let hostname = new URL(url).hostname;
                hostname = hostname.replace('www.', '');
                hostname = hostname.replace('.com.br', '');
                hostname = hostname.replace('.com', '');
                hostname = hostname.replace('.org', '');
                hostname = hostname.replace('.net', '');
                
                const sitesMap = {
                    'g1.globo': 'G1 - Globo',
                    'globo': 'Globo',
                    'youtube': 'YouTube',
                    'twitter': 'Twitter/X',
                    'facebook': 'Facebook',
                    'instagram': 'Instagram',
                    'wikipedia': 'Wikipedia',
                    'reddit': 'Reddit',
                    'uol': 'UOL',
                    'terra': 'Terra',
                    'estadao': 'Estadão',
                    'folha': 'Folha de SP',
                    'cnn': 'CNN Brasil',
                    'bbc': 'BBC News'
                };
                
                for (let [key, value] of Object.entries(sitesMap)) {
                    if (hostname.includes(key)) {
                        return value;
                    }
                }
                
                return hostname.split('.')[0].charAt(0).toUpperCase() + hostname.split('.')[0].slice(1);
            } catch(e) {
                return "Web Proxy";
            }
        }
        
        // Atualizar título
        function updatePageTitle(url) {
            const siteName = getSiteName(url);
            const titleElement = document.getElementById('pageTitle');
            if (titleElement) {
                titleElement.textContent = `${siteName} - Marujo Digital`;
            }
            
            // Favicon dinâmico
            if (url && url.startsWith('http')) {
                try {
                    const domain = new URL(url).hostname;
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                    let link = document.querySelector("link[rel='shortcut icon']");
                    if (!link) {
                        link = document.createElement('link');
                        link.rel = 'shortcut icon';
                        document.head.appendChild(link);
                    }
                    link.href = faviconUrl;
                } catch(e) {}
            }
        }
        
        function showLoader(show) {
            const loader = document.getElementById('loader');
            if (show) {
                loader.classList.add('show');
            } else {
                loader.classList.remove('show');
            }
        }
        
        function carregarUrl(url) {
            if (!url) return;
            
            showLoader(true);
            updatePageTitle(url);
            
            const proxyUrl = PROXY_SERVICE + encodeURIComponent(url);
            const iframe = document.getElementById('proxyFrame');
            
            iframe.onload = function() {
                showLoader(false);
            };
            
            iframe.onerror = function() {
                showLoader(false);
                console.log('Erro ao carregar');
            };
            
            iframe.src = proxyUrl;
            currentUrl = url;
            
            // Atualiza histórico sem recarregar
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('url', url);
            window.history.pushState({url: url}, '', newUrl);
        }
        
        // Extrair URL do path (formato ?https://...)
        function extrairUrlDoPath() {
            let urlCompleta = window.location.href;
            let questionMarkIndex = urlCompleta.indexOf('?');
            
            if (questionMarkIndex !== -1) {
                let urlExtraida = urlCompleta.substring(questionMarkIndex + 1);
                try {
                    urlExtraida = decodeURIComponent(urlExtraida);
                } catch(e) {}
                
                if (urlExtraida && (urlExtraida.startsWith('http://') || urlExtraida.startsWith('https://'))) {
                    return urlExtraida;
                }
            }
            return null;
        }
        
        // Inicialização
        function inicializar() {
            let urlParaCarregar = extrairUrlDoPath();
            
            if (!urlParaCarregar) {
                const params = new URLSearchParams(window.location.search);
                urlParaCarregar = params.get('url');
            }
            
            if (!urlParaCarregar) {
                urlParaCarregar = DEFAULT_URL;
            }
            
            carregarUrl(urlParaCarregar);
        }
        
        inicializar();
        
        // Detectar mudanças no histórico (botão voltar/avançar)
        window.addEventListener('popstate', function(event) {
            const params = new URLSearchParams(window.location.search);
            let url = params.get('url');
            if (url) {
                carregarUrl(url);
            }
        });
    </script>
</body>
