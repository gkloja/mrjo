<script>
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    let currentUrl = DEFAULT_URL;
    
    // Elementos
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const currentSiteSpan = document.getElementById('currentSite');
    const loader = document.getElementById('loader');
    
    // Mostrar/esconder loader
    function showLoader(show) {
        if (show) loader.classList.add('show');
        else loader.classList.remove('show');
    }
    
    // Extrair domínio para exibição
    function getDomainName(url) {
        try {
            const hostname = new URL(url).hostname;
            return hostname.replace('www.', '');
        } catch(e) {
            return 'site';
        }
    }
    
    // Carregar URL no iframe
    function carregarUrl(url) {
        if (!url) return;
        
        // Se não tiver protocolo, adiciona https://
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }
        
        showLoader(true);
        currentUrl = url;
        
        // Atualizar input e status
        urlInput.value = url;
        currentSiteSpan.innerHTML = `🌐 Carregando ${getDomainName(url)}...`;
        
        const proxyUrl = PROXY_SERVICE + encodeURIComponent(url);
        
        // Timeout para loader
        const timeoutId = setTimeout(() => {
            showLoader(false);
            currentSiteSpan.innerHTML = `⚠️ Demorou muito para carregar ${getDomainName(url)}`;
        }, 15000);
        
        iframe.onload = function() {
            clearTimeout(timeoutId);
            showLoader(false);
            currentSiteSpan.innerHTML = `✅ Navegando em ${getDomainName(url)}`;
        };
        
        iframe.onerror = function() {
            clearTimeout(timeoutId);
            showLoader(false);
            currentSiteSpan.innerHTML = `❌ Erro ao carregar ${getDomainName(url)}`;
        };
        
        iframe.src = proxyUrl;
        
        // Salvar no histórico
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', url);
        window.history.pushState({url: url}, '', newUrl);
    }
    
    // Alternar tela cheia
    function toggleFullscreen() {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => {
                console.log(`Erro: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    // Extrair URL da query string
    function extrairUrlDaURL() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        
        // Tentar decode
        try {
            const href = window.location.href;
            const questionIndex = href.indexOf('?');
            if (questionIndex !== -1) {
                let extracted = href.substring(questionIndex + 1);
                extracted = decodeURIComponent(extracted);
                if (extracted.startsWith('http://') || extracted.startsWith('https://')) {
                    return extracted;
                }
            }
        } catch(e) {}
        
        return null;
    }
    
    // Eventos
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
        else carregarUrl(DEFAULT_URL);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    // Carregar anúncios após DOM
    function carregarAnuncios() {
        if (typeof adsbygoogle !== 'undefined') {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch(e) {
                console.log('AdSense:', e.message);
            }
        }
    }
    
    // Inicializar
    function inicializar() {
        let urlParaCarregar = extrairUrlDaURL();
        
        if (!urlParaCarregar) {
            urlParaCarregar = DEFAULT_URL;
        }
        
        urlInput.value = urlParaCarregar;
        carregarUrl(urlParaCarregar);
        
        // Carregar anúncios após 1 segundo
        setTimeout(carregarAnuncios, 1000);
        
        // Recarregar anúncios quando iframe mudar
        iframe.addEventListener('load', () => {
            setTimeout(carregarAnuncios, 500);
        });
    }
    
    // Navegação do histórico
    window.addEventListener('popstate', function(event) {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    inicializar();
</script>
