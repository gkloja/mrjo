<body>
    <!-- Barra superior -->

             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-pub-2351298778216089"

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>

    <script>
        // Serviço proxy
        const PROXY_SERVICE = 'https://cors.eu.org/';
        
        // Função para extrair nome do site da URL
        function getSiteName(url) {
            try {
                if (!url) return "Web Proxy";
                
                let hostname = new URL(url).hostname;
                hostname = hostname.replace('www.', '');
                hostname = hostname.replace('.com.br', '');
                hostname = hostname.replace('.com', '');
                hostname = hostname.replace('.org', '');
                hostname = hostname.replace('.net', '');
                
                // Nomes específicos para sites famosos
                const sitesMap = {
                    'g1.globo': 'G1 - Globo',
                    'globo': 'Globo',
                    'youtube': 'YouTube',
                    'twitter': 'Twitter/X',
                    'facebook': 'Facebook',
                    'instagram': 'Instagram',
                    'wikipedia': 'Wikipedia',
                    'reddit': 'Reddit',
                    'uol': 'UOL',
                    'terra': 'Terra',
                    'estadao': 'Estadão',
                    'folha': 'Folha de SP',
                    'cnn': 'CNN Brasil',
                    'bbc': 'BBC News'
                };
                
                for (let [key, value] of Object.entries(sitesMap)) {
                    if (hostname.includes(key)) {
                        return value;
                    }
                }
                
                // Capitaliza o nome
                return hostname.split('.')[0].charAt(0).toUpperCase() + hostname.split('.')[0].slice(1);
            } catch(e) {
                return "Web Proxy";
            }
        }
        
        // Atualizar título da página
        function updatePageTitle(url) {
            const siteName = getSiteName(url);
            const titleElement = document.getElementById('pageTitle');
            if (titleElement) {
                titleElement.textContent = `${siteName} - Marujo Digital Proxy`;
            }
            // Atualizar também o favicon dinamicamente (opcional)
            if (url && url.startsWith('http')) {
                try {
                    const domain = new URL(url).hostname;
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                    const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                    link.type = 'image/x-icon';
                    link.rel = 'shortcut icon';
                    link.href = faviconUrl;
                    document.head.appendChild(link);
                } catch(e) {}
            }
        }
        
        // Mostrar/Esconder loader
        function showLoader(show) {
            const loader = document.getElementById('loader');
            if (show) {
                loader.classList.add('show');
            } else {
                loader.classList.remove('show');
            }
        }
        
        // Função principal carregar
        function carregar() {
            let url = document.getElementById('urlInput').value;
            if (!url) return;
            
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }
            
            showLoader(true);
            
            // Atualiza título baseado na URL
            updatePageTitle(url);
            
            // Carrega via proxy
            const proxyUrl = PROXY_SERVICE + encodeURIComponent(url);
            const iframe = document.getElementById('proxyFrame');
            
            iframe.onload = function() {
                showLoader(false);
            };
            
            iframe.onerror = function() {
                showLoader(false);
                alert('Erro ao carregar o site. Tente novamente.');
            };
            
            iframe.src = proxyUrl;
            
            // Salva no histórico
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('url', url);
            window.history.pushState({}, '', newUrl);
        }
        
        function abrirOriginal() {
            const url = document.getElementById('urlInput').value;
            if (url) window.open(url, '_blank');
        }
        
        // Extrair URL do caminho (formato ?https://...)
        function extrairUrlDoPath() {
            let urlCompleta = window.location.href;
            let questionMarkIndex = urlCompleta.indexOf('?');
            
            if (questionMarkIndex !== -1) {
                let urlExtraida = urlCompleta.substring(questionMarkIndex + 1);
                try {
                    urlExtraida = decodeURIComponent(urlExtraida);
                } catch(e) {}
                
                if (urlExtraida && (urlExtraida.startsWith('http://') || urlExtraida.startsWith('https://'))) {
                    return urlExtraida;
                }
            }
            return null;
        }
        
        // Carregar da query string
        function carregarDaQueryString() {
            const params = new URLSearchParams(window.location.search);
            let urlParam = params.get('url');
            if (urlParam) {
                document.getElementById('urlInput').value = urlParam;
                carregar();
                return true;
            }
            return false;
        }
        
        // Carregar do path direto
        function carregarDoPath() {
            let urlDireta = extrairUrlDoPath();
            if (urlDireta) {
                document.getElementById('urlInput').value = urlDireta;
                carregar();
                return true;
            }
            return false;
        }
        
        // Inicialização
        function inicializar() {
            if (!carregarDoPath()) {
                carregarDaQueryString();
            }
            
            // Tenta atualizar título com a URL atual
            const urlInput = document.getElementById('urlInput').value;
            if (urlInput) {
                updatePageTitle(urlInput);
            }
        }
        
        // Executar ao carregar
        inicializar();
        
        // Suporte para tecla Enter no input
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                carregar();
            }
        });
    </script>
