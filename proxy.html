        /* ==================== NOTIFICAÇÃO DE CÓPIA ==================== */
        .copy-notification {

            from { transform: translateY(20px); opacity: 0; }

        @keyframes slideDown {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(20px); opacity: 0; }

            }
            .search-form {

        .ad-label {

        }

        .fullscreen-mode .ad-header,

        }

        .fullscreen-mode .fullscreen-btn {

    </style>
</head>

<script>
    // ==================== CONFIGURAÇÃO DO PROXY ====================
    const DEFAULT_URL = 'https://www.google.com/search?q=';
    
    let currentUrl = '';
    let isFullscreenClean = false;
    
    const iframe = document.getElementById('proxyFrame');
    const adHeader = document.getElementById('adHeader');
    const adSidebar = document.getElementById('adSidebar');
    const iframeContainer = document.getElementById('iframeContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const shareMenu = document.getElementById('shareMenu');
    const homeSearch = document.getElementById('homeSearch');
    const body = document.body;
    
    // ==================== COMPARTILHAMENTO ====================
    function toggleShareMenu() {
        shareMenu.classList.toggle('active');
    }
    
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.share-btn') && !e.target.closest('.share-menu')) {
            shareMenu.classList.remove('active');
        }
    });
    
    function getCurrentPageInfo() {
        let siteTitle = 'Resultado';
        try {
            siteTitle = iframe.contentDocument?.title || 'Resultado';
        } catch(e) {
            siteTitle = iframe.getAttribute('title') || 'Resultado';
        }
        
        const baseUrl = window.location.origin + window.location.pathname;
        const proxyUrl = `${baseUrl}?url=${encodeURIComponent(currentUrl)}`;
        
        return {
            url: proxyUrl,
            siteUrl: currentUrl,
            title: siteTitle,
            message: `Confira no G1 Globo: ${siteTitle}`
        };
    }
    
    function updateSiteTitleDisplay() {
        const info = getCurrentPageInfo();
        const titleDisplay = document.getElementById('siteTitleText');
        if (titleDisplay) {
            titleDisplay.textContent = info.title;
        }
    }
    
    iframe.addEventListener('load', function() {
        setTimeout(updateSiteTitleDisplay, 500);
    });
    
    setTimeout(updateSiteTitleDisplay, 1000);
    
    function compartilharLinkedIn() {
        const info = getCurrentPageInfo();
        const linkedInUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(info.url)}`;
        window.open(linkedInUrl, 'linkedin-share', 'width=550,height=480');
        shareMenu.classList.remove('active');
    }
    
    function compartilharTwitter() {
        const info = getCurrentPageInfo();
        const tweetText = `Confira no G1 Globo: ${info.title}\n${info.url}`;
        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
        window.open(twitterUrl, 'twitter-share', 'width=550,height=480');
        shareMenu.classList.remove('active');
    }
    
    function compartilharWhatsApp() {
        const info = getCurrentPageInfo();
        const message = `🔍 ${info.title}\n\nVem conferir no G1 Globo:\n${info.url}`;
        const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, 'whatsapp-share');
        shareMenu.classList.remove('active');
    }
    
    function compartilharTelegram() {
        const info = getCurrentPageInfo();
        const message = `🔍 Confira no G1 Globo:`;
        const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(info.url)}&text=${encodeURIComponent(message)}`;
        window.open(telegramUrl, 'telegram-share');
        shareMenu.classList.remove('active');
    }
    
    function copiarLink() {
        const info = getCurrentPageInfo();
        navigator.clipboard.writeText(info.url).then(() => {
            shareMenu.classList.remove('active');
            
            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.innerHTML = `<i class="fas fa-check-circle" style="margin-right: 8px;"></i>Link copiado!<br><small style="font-size: 11px; margin-top: 4px; opacity: 0.9;">${info.title}</small>`;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        });
    }
    
    // ==================== FECHAR ANÚNCIOS ====================
    function fecharAnuncioTopo() {
        adHeader.classList.add('hidden');
    }
    
    function fecharAnuncioLateral() {
        adSidebar.classList.add('hidden');
    }
    
    // ==================== TELA CHEIA ====================
    function toggleFullscreenClean() {
        isFullscreenClean = !isFullscreenClean;
        
        if (isFullscreenClean) {
            body.classList.add('fullscreen-mode');
            fullscreenBtn.querySelector('.tooltip').textContent = '🎬 Sair do Cinema';
            
            const container = document.getElementById('iframeContainer');
            if (container.requestFullscreen) {
                container.requestFullscreen().catch(err => {
                    console.log('Erro fullscreen:', err);
                });
            }
        } else {
            body.classList.remove('fullscreen-mode');
            fullscreenBtn.querySelector('.tooltip').textContent = '🎬 Modo Cinema';
            
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
    
    document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement && isFullscreenClean) {
            isFullscreenClean = false;
            body.classList.remove('fullscreen-mode');
            fullscreenBtn.querySelector('.tooltip').textContent = '🎬 Modo Cinema';
        }
    });
    
    // ==================== PESQUISAR OU ACESSAR ====================
    function pesquisarOuAcessar(entrada) {
        if (!entrada) return;
        
        let entradaLimpa = entrada.trim();
        
        // Verificar se é uma URL
        const ehUrl = /^(https?:\/\/|www\.|[\w-]+\.[\w-]+\.)/.test(entradaLimpa) ||
                     entradaLimpa.includes('.com') ||
                     entradaLimpa.includes('.br') ||
                     entradaLimpa.includes('.net') ||
                     entradaLimpa.includes('.org') ||
                     entradaLimpa.includes('localhost');
        
        let urlFinal;
        
        if (ehUrl) {
            // Carregar URL direto
            urlFinal = entradaLimpa;
            if (!urlFinal.startsWith('http://') && !urlFinal.startsWith('https://')) {
                urlFinal = 'https://' + urlFinal;
            }
        } else {
            // Pesquisar no DuckDuckGo
            urlFinal = 'https://duckduckgo.com/?q=' + encodeURIComponent(entradaLimpa);
        }
        
        carregarUrl(urlFinal);
        document.getElementById('searchInput').value = '';
    }
    
    // ==================== CARREGAR URL ====================
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        currentUrl = finalUrl;
        iframe.src = finalUrl;
        
        // Esconder home search
        homeSearch.classList.add('hidden');
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
        
        setTimeout(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 500);
    }
    
    function resetToHome() {
        currentUrl = '';
        iframe.src = 'about:blank';
        homeSearch.classList.remove('hidden');
        document.getElementById('searchInput').value = '';
        document.getElementById('searchInput').focus();
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.delete('url');
        window.history.pushState({}, '', newUrl);
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // ==================== INICIALIZAR ====================
    function init() {
        let startUrl = getUrlFromParams();
        if (startUrl) {
            carregarUrl(startUrl);
        }
        
        setInterval(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 30000);
    }
    
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    // Event listener para ENTER no input
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            pesquisarOuAcessar(this.value);
        }
    });
    
    init();
</script>

</body>
