    <style>
        * {

        body {

        /* BARRA SUPERIOR */
        .top-bar {

        }

            border-radius: 6px;

        .url-group {
            flex: 1;

            overflow: hidden;

        .url-group input {

        }

            color: white;

            cursor: pointer;
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        /* ANÚNCIO SUPERIOR (COM BOTÃO FECHAR) */

            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            z-index: 999;

            display: none;
        }

        }

        .ad-close {

        .ad-close:hover {
            color: #333;
        }

        /* ANÚNCIO INFERIOR (COM BOTÃO FECHAR) */

            position: fixed;

            left: 0;
            right: 0;

            border-top: 1px solid #e2e8f0;
            z-index: 999;

        /* MOBILE */

<body>

<!-- BARRA SUPERIOR -->
<div class="top-bar">

            <img src="imagens/logo.png" alt="Logo">
            <span>Marujo Proxy</span>

        <div class="url-group">
            <input type="text" id="urlInput" placeholder="Digite o site..." value="https://g1.globo.com/">
            <button id="goBtn">Ir</button>

        <button class="fullscreen-btn" onclick="toggleFullscreen()">📺 <span>Tela cheia</span></button>

<!-- ANÚNCIO SUPERIOR (COM X) -->
<div id="adTop" class="ad-top">
    <button class="ad-close" onclick="closeAdTop()">×</button>
    <ins class="adsbygoogle"
         style="display:inline-block;width:100%;max-width:728px;height:90px"

<!-- ANÚNCIO INFERIOR (COM X) -->

    <button class="ad-close" onclick="closeAdBottom()">×</button>
    <ins class="adsbygoogle"
         style="display:inline-block;width:100%;max-width:728px;height:90px"
         data-ad-client="ca-pub-2351298778216089"
         data-ad-slot="4868424735"
         data-ad-format="horizontal"
         data-full-width-responsive="true"></ins>
    <script>
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
    </script>
</div>

<!-- IFRAME -->
<div class="iframe-container">
    <iframe id="proxyFrame" src="about:blank"></iframe>
</div>

<script>
    // CONFIGURAÇÃO
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    
    let currentUrl = DEFAULT_URL;
    let adTopVisible = false;
    let adBottomVisible = false;
    
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const adTop = document.getElementById('adTop');
    const adBottom = document.getElementById('adBottom');
    
    // FECHAR ANÚNCIOS
    function closeAdTop() {
        adTop.classList.remove('show');
        adTopVisible = false;
        // Ajustar iframe
        document.querySelector('.iframe-container').style.top = '52px';
    }
    
    function closeAdBottom() {
        adBottom.classList.remove('show');
        adBottomVisible = false;
        document.querySelector('.iframe-container').style.bottom = '0';
    }
    
    // MOSTRAR ANÚNCIOS (alternados para não atrapalhar)
    function mostrarAnuncios() {
        // Mostra anúncio superior a cada 2 acessos
        let count = parseInt(localStorage.getItem('adCount') || '0');
        count++;
        
        if (count >= 2) {
            // Mostra anúncio superior
            adTop.classList.add('show');
            adTopVisible = true;
            document.querySelector('.iframe-container').style.top = '150px';
            count = 0;
        } else {
            // Mostra anúncio inferior
            adBottom.classList.add('show');
            adBottomVisible = true;
            document.querySelector('.iframe-container').style.bottom = '100px';
        }
        
        localStorage.setItem('adCount', count);
        
        // Recarregar anúncios
        setTimeout(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 100);
    }
    
    // CARREGAR URL
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        currentUrl = finalUrl;
        urlInput.value = finalUrl;
        
        const proxyUrl = PROXY_SERVICE + encodeURIComponent(finalUrl);
        
        iframe.onload = function() {
            // Mostra anúncios após carregar
            setTimeout(mostrarAnuncios, 500);
        };
        
        iframe.src = proxyUrl;
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
    }
    
    // RESET
    function resetToHome() {
        carregarUrl(DEFAULT_URL);
    }
    
    // TELA CHEIA
    function toggleFullscreen() {
        const container = document.querySelector('.iframe-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {});
        } else {
            document.exitFullscreen();
        }
    }
    
    // PEGAR URL DOS PARÂMETROS
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // EVENTOS
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    // INICIAR
    function init() {
        let startUrl = getUrlFromParams();
        if (!startUrl) startUrl = DEFAULT_URL;
        
        urlInput.value = startUrl;
        carregarUrl(startUrl);
    }
    
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>

</body>
