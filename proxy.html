    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; }
        iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; background: white; z-index: 1; }
        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; display: none; }
        .loader.show { display: block; }
        .spinner { width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top: 6px solid #003366; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <iframe id="proxyFrame" src="about:blank"></iframe>
    <div class="loader" id="loader"><div class="spinner"></div></div>

    <script>
        const DEFAULT_URL = 'https://g1.globo.com/';
        const PROXY_SERVICE = 'https://cors.eu.org/';
        let currentUrl = DEFAULT_URL;
        
        // ===== MAPA DE SITES PARA TÍTULOS BONITOS =====
        const sitesMap = {
            'g1.globo': { nome: 'G1', fullName: 'G1 - Globo Notícias', categoria: 'Notícias', emoji: '📰' },
            'globo.com': { nome: 'Globo', fullName: 'Globo.com', categoria: 'Portal', emoji: '🌐' },
            'uol.com.br': { nome: 'UOL', fullName: 'UOL - Universo Online', categoria: 'Notícias', emoji: '📰' },
            'terra.com.br': { nome: 'Terra', fullName: 'Terra - Notícias', categoria: 'Notícias', emoji: '📰' },
            'youtube.com': { nome: 'YouTube', fullName: 'YouTube - Vídeos', categoria: 'Vídeos', emoji: '📹' },
            'twitter.com': { nome: 'Twitter', fullName: 'Twitter/X', categoria: 'Social', emoji: '🐦' },
            'x.com': { nome: 'X', fullName: 'X (Twitter)', categoria: 'Social', emoji: '🐦' },
            'facebook.com': { nome: 'Facebook', fullName: 'Facebook', categoria: 'Social', emoji: '👥' },
            'instagram.com': { nome: 'Instagram', fullName: 'Instagram', categoria: 'Social', emoji: '📸' },
            'wikipedia.org': { nome: 'Wikipedia', fullName: 'Wikipedia - Enciclopédia', categoria: 'Referência', emoji: '📚' },
            'github.com': { nome: 'GitHub', fullName: 'GitHub - Desenvolvimento', categoria: 'Tech', emoji: '💻' },
            'netflix.com': { nome: 'Netflix', fullName: 'Netflix - Streaming', categoria: 'Streaming', emoji: '🎬' },
            'spotify.com': { nome: 'Spotify', fullName: 'Spotify - Música', categoria: 'Música', emoji: '🎵' },
            'amazon.com': { nome: 'Amazon', fullName: 'Amazon - Compras', categoria: 'Compras', emoji: '🛒' },
            'mercadolivre.com.br': { nome: 'Mercado Livre', fullName: 'Mercado Livre', categoria: 'Compras', emoji: '🛍️' }
        };
        
        // ===== EXTRAIR INFORMAÇÕES DO SITE =====
        function getSiteInfo(url) {
            try {
                if (!url) return { nome: 'Proxy', fullName: 'Marujo Digital Proxy', categoria: 'Ferramenta', emoji: '🔗' };
                
                let hostname = new URL(url).hostname;
                hostname = hostname.replace('www.', '');
                
                for (let [domain, info] of Object.entries(sitesMap)) {
                    if (hostname.includes(domain)) {
                        return info;
                    }
                }
                
                let nomeLimpo = hostname.split('.')[0];
                nomeLimpo = nomeLimpo.charAt(0).toUpperCase() + nomeLimpo.slice(1);
                
                return { nome: nomeLimpo, fullName: nomeLimpo, categoria: 'Site', emoji: '🌐' };
            } catch(e) {
                return { nome: 'Proxy', fullName: 'Marujo Digital Proxy', categoria: 'Ferramenta', emoji: '🔗' };
            }
        }
        
        // ===== ATUALIZAR META TAGS PARA PREVIEW NO WHATSAPP =====
        function updateMetaTags(url) {
            const siteInfo = getSiteInfo(url);
            const proxyUrl = `https://marujodigital.onrender.com/proxy?${encodeURIComponent(url)}`;
            
            // Título da página
            document.title = `${siteInfo.emoji} ${siteInfo.fullName} | Marujo Proxy`;
            
            // Meta Description
            const metaDesc = document.getElementById('metaDescription');
            if (metaDesc) {
                metaDesc.setAttribute('content', `📱 Visualize ${siteInfo.fullName} de forma rápida e segura através do proxy do Marujo Digital. Acesse agora!`);
            }
            
            // Open Graph Title
            const ogTitle = document.getElementById('metaOgTitle');
            if (ogTitle) {
                ogTitle.setAttribute('content', `${siteInfo.emoji} ${siteInfo.fullName} - Marujo Proxy`);
            }
            
            // Open Graph Description
            const ogDesc = document.getElementById('metaOgDescription');
            if (ogDesc) {
                ogDesc.setAttribute('content', `📰 Acesse ${siteInfo.fullName} diretamente pelo nosso proxy. Navegue com segurança e privacidade!`);
            }
            
            // Open Graph URL
            const ogUrl = document.getElementById('metaOgUrl');
            if (ogUrl) {
                ogUrl.setAttribute('content', proxyUrl);
            }
            
            // Twitter Card
            const twitterTitle = document.getElementById('metaTwitterTitle');
            if (twitterTitle) {
                twitterTitle.setAttribute('content', `${siteInfo.emoji} ${siteInfo.fullName} - Marujo Proxy`);
            }
            
            const twitterDesc = document.getElementById('metaTwitterDescription');
            if (twitterDesc) {
                twitterDesc.setAttribute('content', `📱 Acesse ${siteInfo.fullName} no seu navegador através do proxy do Marujo Digital!`);
            }
            
            // Imagem dinâmica (tenta pegar favicon do site)
            try {
                const domain = new URL(url).hostname;
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
                const ogImage = document.getElementById('metaOgImage');
                if (ogImage) {
                    ogImage.setAttribute('content', faviconUrl);
                }
            } catch(e) {}
            
            console.log(`📌 Meta tags atualizadas para: ${siteInfo.fullName}`);
        }
        
        // ===== ATUALIZAR FAVICON =====
        function updateFavicon(url) {
            if (url && url.startsWith('http')) {
                try {
                    const domain = new URL(url).hostname;
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                    let link = document.querySelector("link[rel='shortcut icon']");
                    if (!link) {
                        link = document.createElement('link');
                        link.rel = 'shortcut icon';
                        document.head.appendChild(link);
                    }
                    link.href = faviconUrl;
                } catch(e) {}
            }
        }
        
        function showLoader(show) {
            const loader = document.getElementById('loader');
            if (show) loader.classList.add('show');
            else loader.classList.remove('show');
        }
        
        function carregarUrl(url) {
            if (!url) return;
            
            showLoader(true);
            updateMetaTags(url);
            updateFavicon(url);
            
            const proxyUrl = PROXY_SERVICE + encodeURIComponent(url);
            const iframe = document.getElementById('proxyFrame');
            
            const timeoutId = setTimeout(() => {
                showLoader(false);
            }, 10000);
            
            iframe.onload = function() {
                clearTimeout(timeoutId);
                showLoader(false);
            };
            
            iframe.onerror = function() {
                clearTimeout(timeoutId);
                showLoader(false);
            };
            
            iframe.src = proxyUrl;
            currentUrl = url;
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('url', url);
            window.history.pushState({url: url}, '', newUrl);
        }
        
        function extrairUrlDoPath() {
            let urlCompleta = window.location.href;
            let questionMarkIndex = urlCompleta.indexOf('?');
            
            if (questionMarkIndex !== -1) {
                let urlExtraida = urlCompleta.substring(questionMarkIndex + 1);
                try {
                    urlExtraida = decodeURIComponent(urlExtraida);
                } catch(e) {}
                
                if (urlExtraida.includes('&url=')) {
                    urlExtraida = urlExtraida.split('&url=')[0];
                }
                
                if (urlExtraida && (urlExtraida.startsWith('http://') || urlExtraida.startsWith('https://'))) {
                    return urlExtraida;
                }
            }
            return null;
        }
        
        function inicializar() {
            let urlParaCarregar = extrairUrlDoPath();
            
            if (!urlParaCarregar) {
                const params = new URLSearchParams(window.location.search);
                urlParaCarregar = params.get('url');
            }
            
            if (!urlParaCarregar) {
                urlParaCarregar = DEFAULT_URL;
            }
            
            // Atualiza meta tags ANTES de carregar (para o preview do WhatsApp)
            updateMetaTags(urlParaCarregar);
            updateFavicon(urlParaCarregar);
            
            carregarUrl(urlParaCarregar);
        }
        
        inicializar();
        
        window.addEventListener('popstate', function(event) {
            const params = new URLSearchParams(window.location.search);
            let url = params.get('url');
            if (url && url !== currentUrl) {
                carregarUrl(url);
            }
        });
    </script>
</body>
</html>
