        .nav-bar {

        .url-bar:focus-within {

            background: #1a1a2e;
        }

        .url-bar input {
            flex: 1;
            padding: 10px 18px;

        .url-bar input::placeholder {

        .url-bar button {

        .modal-ad {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-ad.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            padding: 24px;
            text-align: center;
            position: relative;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-title {

            font-weight: 600;

        .ad-space {

        .btn-continue {

            border: none;
            padding: 12px 24px;

            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn-continue:hover {

        }

        /* ==================== BANNER INFERIOR DISCRETO ==================== */
        .banner-ad {
            position: fixed;

            background: white;
            border-radius: 12px;

            z-index: 999;

            border: 1px solid #e5e7eb;
        }

        .banner-ad.show {

        .banner-close {
            position: absolute;
            top: -8px;

            background: #1a1a2e;
            color: white;
            border: none;

            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==================== LOADER DISCRETO ==================== */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1002;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .loader.show {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsivo */
        @media (max-width: 640px) {

<body>

<!-- BARRA SUPERIOR -->
<div class="nav-bar">

<!-- MODAL DE ANÚNCIO (aparece só às vezes) -->
<div id="modalAd" class="modal-ad">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModalAd()">×</button>
        <div class="modal-title">🌊 Marujo Proxy</div>

<!-- BANNER DISCRETO (canto inferior) -->
<div id="bannerAd" class="banner-ad">
    <button class="banner-close" onclick="closeBannerAd()">×</button>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-2351298778216089"
         data-ad-slot="4868424735"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
    </script>
</div>

<!-- LOADER -->
<div class="loader" id="loader">
    <div class="spinner"></div>
    <span>Carregando...</span>
</div>

<script>
    // ==================== CONFIGURAÇÃO ====================
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    
    let currentUrl = DEFAULT_URL;
    let modalShown = false;
    let sessionCount = parseInt(localStorage.getItem('proxySessionCount') || '0');
    
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const loader = document.getElementById('loader');
    const modalAd = document.getElementById('modalAd');
    const bannerAd = document.getElementById('bannerAd');
    
    // ==================== FUNÇÕES ====================
    function showLoader(show) {
        if (show) {
            loader.classList.add('show');
        } else {
            loader.classList.remove('show');
        }
    }
    
    function showModalAd() {
        // Mostra modal a cada 3 acessos ou a cada 5 minutos
        sessionCount++;
        localStorage.setItem('proxySessionCount', sessionCount);
        
        if (sessionCount >= 3) {
            modalAd.classList.add('show');
            sessionCount = 0;
            localStorage.setItem('proxySessionCount', 0);
            
            // Recarregar anúncio do modal
            setTimeout(() => {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }, 100);
        } else {
            // Mostra banner discreto
            bannerAd.classList.add('show');
            setTimeout(() => {
                if (bannerAd.classList.contains('show')) {
                    bannerAd.classList.remove('show');
                }
            }, 8000);
        }
    }
    
    function closeModalAd() {
        modalAd.classList.remove('show');
    }
    
    function closeBannerAd() {
        bannerAd.classList.remove('show');
    }
    
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        showLoader(true);
        currentUrl = finalUrl;
        urlInput.value = finalUrl;
        
        const proxyUrl = PROXY_SERVICE + encodeURIComponent(finalUrl);
        
        iframe.onload = function() {
            showLoader(false);
            // Mostra anúncio após carregar
            setTimeout(() => {
                showModalAd();
            }, 500);
        };
        
        iframe.onerror = function() {
            showLoader(false);
        };
        
        iframe.src = proxyUrl;
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
    }
    
    function resetToHome() {
        carregarUrl(DEFAULT_URL);
    }
    
    function toggleFullscreen() {
        const wrapper = document.querySelector('.iframe-wrapper');
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().catch(err => {
                console.log('Erro fullscreen:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // ==================== EVENTOS ====================
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    // ==================== INICIALIZAR ====================
    function init() {
        let startUrl = getUrlFromParams();
        if (!startUrl) startUrl = DEFAULT_URL;
        
        urlInput.value = startUrl;
        carregarUrl(startUrl);
    }
    
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>

</body>
