    <script>
        // ==================== VARIÁVEIS GLOBAIS ====================
        const shareMenu = document.getElementById('shareMenu');
        const searchMenu = document.getElementById('searchMenu');
        const notificationMenu = document.getElementById('notificationMenu');
        const shareBtn = document.getElementById('shareBtn');
        const searchBtn = document.getElementById('searchBtn');
        const notificationBtn = document.getElementById('notificationBtn');
        const homeSearch = document.getElementById('homeSearch');
        const iframe = document.getElementById('contentFrame');
        const adHeader = document.getElementById('adHeader');
        
        let currentUrl = '';
        let isFullscreenClean = false;
        let notificationCount = 0;
        let notifications = [];

        // ==================== EVENTOS DOS MENUS ====================
        shareBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            shareMenu.classList.toggle('active');
            searchMenu.classList.remove('active');
            notificationMenu.classList.remove('active');
        });

        searchBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            searchMenu.classList.toggle('active');
            shareMenu.classList.remove('active');
            notificationMenu.classList.remove('active');
            document.getElementById('searchMenuInput').focus();
        });

        notificationBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            notificationMenu.classList.toggle('active');
            shareMenu.classList.remove('active');
            searchMenu.classList.remove('active');
        });

        // Fechar menus ao clicar fora
        document.addEventListener('click', function() {
            shareMenu.classList.remove('active');
            searchMenu.classList.remove('active');
            notificationMenu.classList.remove('active');
        });

        // Pesquisa no menu de pesquisa
        document.getElementById('searchMenuInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                pesquisarOuAcessar(this.value);
                searchMenu.classList.remove('active');
            }
        });

        // ==================== FUNÇÕES DE NOTIFICAÇÃO ====================
        function adicionarNotificacao(titulo, mensagem) {
            const notif = {
                id: Date.now(),
                titulo: titulo,
                mensagem: mensagem,
                horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})
            };
            
            notifications.unshift(notif);
            notificationCount++;
            
            atualizarNotificacoes();
            
            // Auto-remover depois de 5 segundos
            setTimeout(() => {
                removerNotificacao(notif.id);
            }, 5000);
        }

        function removerNotificacao(id) {
            notifications = notifications.filter(n => n.id !== id);
            atualizarNotificacoes();
        }

        function atualizarNotificacoes() {
            const notificationList = document.getElementById('notificationList');
            const badge = document.getElementById('notificationBadge');

            if (notifications.length === 0) {
                notificationList.innerHTML = '<div class="notification-empty">Nenhuma notificação no momento</div>';
                badge.style.display = 'none';
                notificationCount = 0;
            } else {
                notificationList.innerHTML = notifications.map(notif => `
                    <div class="notification-item unread">
                        <div class="notification-title">${notif.titulo}</div>
                        <div class="notification-text">${notif.mensagem}</div>
                        <div class="notification-time">${notif.horario}</div>
                    </div>
                `).join('');
                
                if (notificationCount > 0) {
                    badge.textContent = Math.min(notificationCount, 9) + (notificationCount > 9 ? '+' : '');
                    badge.style.display = 'flex';
                }
            }
        }

        // ==================== ONESIGNAL - RECEBER NOTIFICAÇÕES ====================
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
              appId: "9b1da6f9-89a0-4fbd-8685-438ce87a6607",
              notifyButton: {
                enable: false
              }
            });

            // Listener para receber notificações push
            OneSignal.Notifications.addEventListener('foreground', function(event) {
                const notif = event.notification;
                adicionarNotificacao(
                    notif.title || '📢 Nova notificação',
                    notif.body || 'Você tem uma nova mensagem'
                );
            });

            if (typeof LibSignal !== "undefined") {
              LibSignal.register();
            }
        });

        // ==================== FUNÇÕES DE COMPARTILHAMENTO ====================
        function getCurrentPageInfo() {
            let siteTitle = 'G1 Globo';
            try {
                siteTitle = iframe.contentDocument?.title || 'Resultado';
            } catch(e) {
                siteTitle = iframe.getAttribute('title') || 'Resultado';
            }
            
            const baseUrl = window.location.origin + window.location.pathname;
            const proxyUrl = `${baseUrl}?url=${encodeURIComponent(currentUrl)}`;
            
            return {
                url: proxyUrl,
                siteUrl: currentUrl,
                title: siteTitle,
                message: `Confira no G1 Globo: ${siteTitle}`
            };
        }
        
        function updateSiteTitleDisplay() {
            const info = getCurrentPageInfo();
            const titleDisplay = document.getElementById('siteTitleText');
            if (titleDisplay) {
                titleDisplay.textContent = info.title;
            }
        }
        
        iframe.addEventListener('load', function() {
            setTimeout(updateSiteTitleDisplay, 500);
        });
        
        setTimeout(updateSiteTitleDisplay, 1000);
        
        function compartilharLinkedIn() {
            const info = getCurrentPageInfo();
            const linkedInUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(info.url)}`;
            window.open(linkedInUrl, 'linkedin-share', 'width=550,height=480');
            shareMenu.classList.remove('active');
        }
        
        function compartilharTwitter() {
            const info = getCurrentPageInfo();
            const tweetText = `Confira no G1 Globo: ${info.title}\n${info.url}`;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
            window.open(twitterUrl, 'twitter-share', 'width=550,height=480');
            shareMenu.classList.remove('active');
        }
        
        function compartilharWhatsApp() {
            const info = getCurrentPageInfo();
            const message = `🔍 ${info.title}\n\nVem conferir no G1 Globo:\n${info.url}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, 'whatsapp-share');
            shareMenu.classList.remove('active');
        }
        
        function compartilharTelegram() {
            const info = getCurrentPageInfo();
            const message = `🔍 Confira no G1 Globo:`;
            const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(info.url)}&text=${encodeURIComponent(message)}`;
            window.open(telegramUrl, 'telegram-share');
            shareMenu.classList.remove('active');
        }
        
        function copiarLink() {
            const info = getCurrentPageInfo();
            navigator.clipboard.writeText(info.url).then(() => {
                shareMenu.classList.remove('active');
                
                const notification = document.createElement('div');
                notification.className = 'copy-notification';
                notification.innerHTML = `<i class="fas fa-check-circle" style="margin-right: 8px;"></i>Link copiado!<br><small style="font-size: 11px; margin-top: 4px; opacity: 0.9;">${info.title}</small>`;
                document.body.appendChild(notification);
                
                setTimeout(() => notification.remove(), 3000);
            });
        }
        
        // ==================== FECHAR ANÚNCIOS ====================
        function fecharAnuncioTopo() {
            adHeader.classList.add('hidden');
        }
        
        // ==================== PESQUISAR OU ACESSAR ====================
        function pesquisarOuAcessar(entrada) {
            if (!entrada) return;
            
            let entradaLimpa = entrada.trim();
            
            // Verificar se é uma URL
            const ehUrl = /^(https?:\/\/|www\.|[\w-]+\.[\w-]+\.)/.test(entradaLimpa) ||
                         entradaLimpa.includes('.com') ||
                         entradaLimpa.includes('.br') ||
                         entradaLimpa.includes('.net') ||
                         entradaLimpa.includes('.org') ||
                         entradaLimpa.includes('localhost');
            
            let urlFinal;
            
            if (ehUrl) {
                urlFinal = entradaLimpa;
                if (!urlFinal.startsWith('http://') && !urlFinal.startsWith('https://')) {
                    urlFinal = 'https://' + urlFinal;
                }
            } else {
                urlFinal = 'https://g1.globo.com/busca/?q=' + encodeURIComponent(entradaLimpa);
            }
            
            carregarUrl(urlFinal);
            document.getElementById('searchInput').value = '';
        }
        
        // ==================== CARREGAR URL ====================
        function carregarUrl(url) {
            if (!url) return;
            
            let finalUrl = url.trim();
            
            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                finalUrl = 'https://' + finalUrl;
            }
            
            currentUrl = finalUrl;
            
            let urlParaCarregar;
            
            if (finalUrl.includes('ge.globo.com')) {
                urlParaCarregar = 'https://orange-hill-2e61.gbscabral15.workers.dev/?url=' + encodeURIComponent(finalUrl);
            } else {
                urlParaCarregar = finalUrl;
            }
            
            iframe.src = urlParaCarregar;
            
            homeSearch.classList.add('hidden');
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('url', finalUrl);
            window.history.pushState({ url: finalUrl }, '', newUrl);
            
            setTimeout(() => {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }, 500);
        }
        
        function resetToHome() {
            currentUrl = '';
            iframe.src = 'about:blank';
            homeSearch.classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInput').focus();
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('url');
            window.history.pushState({}, '', newUrl);
        }
        
        function getUrlFromParams() {
            const params = new URLSearchParams(window.location.search);
            let url = params.get('url');
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                return url;
            }
            return null;
        }
        
        // ==================== INICIALIZAR ====================
        function init() {
            let startUrl = getUrlFromParams();
            if (startUrl) {
                carregarUrl(startUrl);
            }
            
            setInterval(() => {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }, 30000);
        }
        
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            let url = params.get('url');
            if (url && url !== currentUrl) {
                carregarUrl(url);
            }
        });
        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                pesquisarOuAcessar(this.value);
            }
        });
        
        init();

        // ==================== TESTE DE NOTIFICAÇÕES ====================
        // Descomente para testar notificações localmente
        // setTimeout(() => {
        //     adicionarNotificacao('📰 Notícia Importante', 'Acompanhe as últimas notícias do G1 Globo');
        // }, 2000);
    </script>
