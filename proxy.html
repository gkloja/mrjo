<script>
    // ==================== CONFIGURAÇÃO ====================
    const DEFAULT_URL = 'https://www.google.com';
    let currentUrl = DEFAULT_URL;
    let isFullscreenClean = false;
    
    // ==================== ELEMENTOS ====================
    const shareBtn = document.getElementById('shareBtn');
    const shareMenu = document.getElementById('shareMenu');
    const adHeader = document.getElementById('adHeader');
    const adSidebar = document.getElementById('adSidebar');
    const iframeContainer = document.getElementById('iframeContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const logo = document.getElementById('logo');
    const body = document.body;
    
    // ==================== USAR IFRAME EXISTENTE OU CRIAR ====================
    let iframe = document.getElementById('mainIframe');
    if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'mainIframe';
        iframeContainer.appendChild(iframe);
    }
    
    iframe.style.display = 'block';
    
    // Configurar referência de namespace global para carregar
    window.pesquisarNoGoogle = pesquisarNoGoogle;
    window.carregarUrl = carregarUrl;
    window.resetToHome = resetToHome;
    window.toggleFullscreenClean = toggleFullscreenClean;
    window.fecharAnuncioTopo = fecharAnuncioTopo;
    window.fecharAnuncioLateral = fecharAnuncioLateral;
    window.compartilharLinkedIn = compartilharLinkedIn;
    window.compartilharTwitter = compartilharTwitter;
    window.compartilharWhatsApp = compartilharWhatsApp;
    window.compartilharTelegram = compartilharTelegram;
    window.copiarLink = copiarLink;
    
    // Logo clicável para voltar ao home
    logo.addEventListener('click', () => {
        resetToHome();
        iframeContainer.querySelector('.home-container')?.scrollIntoView();
    });
    
    // ==================== COMPARTILHAMENTO ====================
    function toggleShareMenu() {
        shareMenu.classList.toggle('active');
    }
    
    shareBtn.addEventListener('click', toggleShareMenu);
    
    // Fechar menu quando clicar fora
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.share-btn') && !e.target.closest('.share-menu')) {
            shareMenu.classList.remove('active');
        }
    });
    
    function getCurrentPageInfo() {
        let siteTitle = 'Resultado da Pesquisa';
        try {
            const pageTitle = iframe.contentDocument?.title;
            if (pageTitle && pageTitle.trim()) {
                siteTitle = pageTitle;
            }
        } catch(e) {
            // Se não conseguir acessar o title por CORS, usa o padrão
        }
        
        const baseUrl = window.location.origin + window.location.pathname;
        const proxyUrl = `${baseUrl}?url=${encodeURIComponent(currentUrl)}`;
        
        return {
            url: proxyUrl,
            siteUrl: currentUrl,
            title: siteTitle,
            message: `Confira no G1 Globo: ${siteTitle}`
        };
    }
    
    function updateSiteTitleDisplay() {
        const info = getCurrentPageInfo();
        const titleDisplay = document.getElementById('siteTitleText');
        if (titleDisplay) {
            titleDisplay.textContent = info.title;
        }
    }
    
    iframe.addEventListener('load', function() {
        setTimeout(updateSiteTitleDisplay, 500);
    });
    
    setTimeout(updateSiteTitleDisplay, 1000);
    
    function compartilharLinkedIn() {
        const info = getCurrentPageInfo();
        const linkedInUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(info.url)}`;
        window.open(linkedInUrl, 'linkedin-share', 'width=550,height=480');
        shareMenu.classList.remove('active');
    }
    
    function compartilharTwitter() {
        const info = getCurrentPageInfo();
        const tweetText = `Encontrei no G1 Globo: ${info.title}\n${info.url}`;
        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
        window.open(twitterUrl, 'twitter-share', 'width=550,height=480');
        shareMenu.classList.remove('active');
    }
    
    function compartilharWhatsApp() {
        const info = getCurrentPageInfo();
        const message = `🔍 *${info.title}*\n\nEncontrei no G1 Globo 🚀\n${info.url}`;
        const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, 'whatsapp-share');
        shareMenu.classList.remove('active');
    }
    
    function compartilharTelegram() {
        const info = getCurrentPageInfo();
        const message = `🔍 Encontrei no G1 Globo:`;
        const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(info.url)}&text=${encodeURIComponent(message)}`;
        window.open(telegramUrl, 'telegram-share');
        shareMenu.classList.remove('active');
    }
    
    function copiarLink() {
        const info = getCurrentPageInfo();
        navigator.clipboard.writeText(info.url).then(() => {
            shareMenu.classList.remove('active');
            
            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.innerHTML = `<i class="fas fa-check-circle" style="margin-right: 8px;"></i>Link do Proxy copiado!<br><small style="font-size: 11px; margin-top: 4px; opacity: 0.9;">${info.title}</small>`;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        });
    }
    
    // ==================== FECHAR ANÚNCIOS ====================
    function fecharAnuncioTopo() {
        adHeader.classList.add('hidden');
        if (!isFullscreenClean) {
            if (window.innerWidth >= 1024 && !adSidebar.classList.contains('hidden')) {
                iframeContainer.style.top = '60px';
                iframeContainer.style.left = '170px';
            } else if (window.innerWidth >= 1024 && adSidebar.classList.contains('hidden')) {
                iframeContainer.style.top = '60px';
                iframeContainer.style.left = '0';
            } else {
                iframeContainer.style.top = '52px';
            }
        }
    }
    
    function fecharAnuncioLateral() {
        adSidebar.classList.add('hidden');
        if (!isFullscreenClean) {
            iframeContainer.style.left = '0';
        }
    }
    
    // ==================== TELA CHEIA ====================
    function toggleFullscreenClean() {
        isFullscreenClean = !isFullscreenClean;
        
        if (isFullscreenClean) {
            body.classList.add('fullscreen-mode');
            fullscreenBtn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
            fullscreenBtn.querySelector('.tooltip').textContent = '🎬 Sair do Modo Cinema';
            
            const container = document.getElementById('iframeContainer');
            if (container.requestFullscreen) {
                container.requestFullscreen().catch(err => {
                    console.log('Erro fullscreen:', err);
                });
            }
        } else {
            body.classList.remove('fullscreen-mode');
            fullscreenBtn.style.background = "linear-gradient(135deg, #C1272D, #A41E23)";
            fullscreenBtn.querySelector('.tooltip').textContent = '🎬 Modo Cinema';
            
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
            
            setTimeout(() => {
                if (!adHeader.classList.contains('hidden')) {
                    iframeContainer.style.top = '130px';
                } else {
                    iframeContainer.style.top = '60px';
                }
                
                if (window.innerWidth >= 1024 && !adSidebar.classList.contains('hidden')) {
                    iframeContainer.style.left = '170px';
                } else {
                    iframeContainer.style.left = '0';
                }
            }, 100);
        }
    }
    
    document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement && isFullscreenClean) {
            isFullscreenClean = false;
            body.classList.remove('fullscreen-mode');
            fullscreenBtn.style.background = "linear-gradient(135deg, #C1272D, #A41E23)";
            fullscreenBtn.querySelector('.tooltip').textContent = '🎬 Modo Cinema';
            
            setTimeout(() => {
                if (!adHeader.classList.contains('hidden')) {
                    iframeContainer.style.top = '130px';
                } else {
                    iframeContainer.style.top = '60px';
                }
                
                if (window.innerWidth >= 1024 && !adSidebar.classList.contains('hidden')) {
                    iframeContainer.style.left = '170px';
                } else {
                    iframeContainer.style.left = '0';
                }
            }, 100);
        }
    });
    
    // ==================== PESQUISAR NO GOOGLE ====================
    function pesquisarNoGoogle(pesquisa) {
        if (!pesquisa) return;
        
        let pesquisaLimpa = pesquisa.trim();
        
        // Verificar se é uma URL válida
        const ehUrl = pesquisaLimpa.includes('.') && 
                     (pesquisaLimpa.includes('.com') || 
                      pesquisaLimpa.includes('.br') || 
                      pesquisaLimpa.includes('.net') ||
                      pesquisaLimpa.includes('.org') ||
                      pesquisaLimpa.includes('localhost') ||
                      pesquisaLimpa.startsWith('http://') ||
                      pesquisaLimpa.startsWith('https://'));
        
        let urlFinal;
        
        if (ehUrl) {
            // Se for URL, carrega direto
            urlFinal = pesquisaLimpa;
            if (!urlFinal.startsWith('http://') && !urlFinal.startsWith('https://')) {
                urlFinal = 'https://' + urlFinal;
            }
        } else {
            // Se for pesquisa, busca no Google
            urlFinal = 'https://www.google.com/search?q=' + encodeURIComponent(pesquisaLimpa);
        }
        
        carregarUrl(urlFinal);
        
        // Limpar o input
        document.getElementById('searchInput').value = '';
    }
    
    // ==================== CARREGAR URL ====================
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        currentUrl = finalUrl;
        iframe.src = finalUrl;
        
        // Mostrar o iframe e esconder o home
        iframe.style.display = 'block';
        const homeContainer = iframeContainer.querySelector('.home-container');
        if (homeContainer) homeContainer.style.display = 'none';
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
        
        setTimeout(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 500);
    }
    
    function resetToHome() {
        const homeContainer = iframeContainer.querySelector('.home-container');
        if (homeContainer) homeContainer.style.display = 'flex';
        iframe.style.display = 'none';
        iframe.src = '';
        currentUrl = DEFAULT_URL;
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.delete('url');
        window.history.pushState({}, '', newUrl);
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // ==================== EVENT LISTENERS DO INPUT ====================
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                pesquisarNoGoogle(this.value);
            }
        });
    }
    
    // ==================== INICIALIZAR ====================
    function init() {
        let startUrl = getUrlFromParams();
        if (startUrl) {
            carregarUrl(startUrl);
        }
        
        setInterval(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 30000);
    }
    
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>
