    <style>
        * {
            margin: 0;

        body {
            background: #0f172a;

        /* BARRA SUPERIOR */
        .proxy-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-bottom: 1px solid #334155;

        .bar-container {
            max-width: 1400px;

        .logo {
            display: flex;

        .logo-img {

        .logo-text {

        .url-wrapper {
            flex: 1;
            min-width: 260px;
            display: flex;
            align-items: center;

            border: 1px solid #334155;
            border-radius: 48px;

        .url-wrapper:focus-within {

            padding-left: 16px;

        }

            flex: 1;

            border: none;
            padding: 10px 12px;
            font-size: 14px;
            color: #e2e8f0;

        }

        .url-input::placeholder {
            color: #475569;
        }

        .go-btn {
            background: #3b82f6;
            border: none;
            padding: 6px 20px;
            margin: 4px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .go-btn:hover {
            background: #2563eb;
        }

        .fullscreen-btn {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 7px 14px;
            border-radius: 32px;
            color: #cbd5e1;

            cursor: pointer;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover {

        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
            background: #1e293b;
            padding: 5px 14px;
            border-radius: 32px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .status-dot.loading {
            background: #eab308;
            animation: pulse 0.5s infinite;
        }

        .status-dot.error {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ANÚNCIO SUPERIOR */
        .ads-top {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            background: white;
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            z-index: 999;
            display: block;
            min-height: 110px;
        }

        /* CONTAINER DO IFRAME */
        .site-container {
            position: fixed;
            top: 170px;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .ads-top { top: 56px; min-height: auto; padding: 8px; }
            .site-container { top: 150px; }
            .proxy-bar { padding: 8px 12px; }
            .url-input { font-size: 12px; }
            .go-btn { padding: 5px 14px; font-size: 11px; }
            .status { display: none; }
        }

        /* MENSAGEM DE STATUS DO PROXY */
        .proxy-message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 11px;
            font-family: monospace;
            z-index: 1001;
            border: 1px solid #334155;
            pointer-events: none;
        }

        .proxy-message.error {
            background: #7f1d1d;
            color: #fca5a5;
            border-color: #ef4444;
        }

        .proxy-message.success {
            background: #064e3b;
            color: #6ee7b7;
            border-color: #10b981;
        }

        /* LOADER MELHORADO */
        .loader-overlay {
            position: fixed;
            top: 170px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 1002;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .loader-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .loader-overlay { top: 150px; }
        }

        .ad-label {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<div class="proxy-bar">
    <div class="bar-container">
        <div class="logo" onclick="resetToHome()">
            <div class="logo-img">🌊</div>
            <span class="logo-text">Marujo<span>Proxy</span></span>
        </div>
        
        <div class="url-wrapper">
            <span class="url-icon">🔒</span>
            <input type="text" id="urlInput" class="url-input" placeholder="ex: g1.globo.com ou https://...">
            <button id="goBtn" class="go-btn">Ir</button>
        </div>
        
        <button class="fullscreen-btn" onclick="toggleFullscreen()">
            🖥️ Tela cheia
        </button>
        
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Pronto</span>
        </div>
    </div>
</div>

<!-- ANÚNCIO -->
<div class="ads-top">
    <div class="ad-label">PUBLICIDADE</div>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-2351298778216089"
         data-ad-slot="4868424735"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) { console.log('AdSense:', e); }
    </script>
</div>

<!-- CONTAINER DO SITE -->
<div class="site-container">
    <iframe id="proxyFrame" src="about:blank" title="Marujo Proxy"></iframe>
</div>

<!-- MENSAGEM DE STATUS DO PROXY -->
<div id="proxyMessage" class="proxy-message">
    🔄 Conectando ao proxy...
</div>

<!-- LOADER -->
<div id="loaderOverlay" class="loader-overlay">
    <div class="loader-spinner"></div>
    <div class="loader-text" id="loaderText">Carregando site...</div>
</div>

<script>
    // ==================== CONFIGURAÇÃO ====================
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    
    // PROXY ALTERNATIVO (caso o principal falhe)
    const PROXY_BACKUP = 'https://corsproxy.io/';
    
    let currentUrl = DEFAULT_URL;
    let currentProxy = PROXY_SERVICE;
    let loadTimeout = null;
    let tentativasProxy = 0;
    
    // Elementos
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const loaderOverlay = document.getElementById('loaderOverlay');
    const loaderText = document.getElementById('loaderText');
    const proxyMessage = document.getElementById('proxyMessage');
    
    // ==================== FUNÇÕES DE STATUS ====================
    function setStatus(status, message) {
        statusText.textContent = message;
        statusDot.className = 'status-dot';
        if (status === 'loading') {
            statusDot.classList.add('loading');
        } else if (status === 'error') {
            statusDot.classList.add('error');
        }
    }
    
    function setProxyMessage(message, type = 'info') {
        proxyMessage.textContent = message;
        proxyMessage.className = 'proxy-message';
        if (type === 'error') proxyMessage.classList.add('error');
        if (type === 'success') proxyMessage.classList.add('success');
        
        // Esconder após 3 segundos se for sucesso
        if (type === 'success') {
            setTimeout(() => {
                if (proxyMessage.classList.contains('success')) {
                    proxyMessage.style.opacity = '0.5';
                }
            }, 3000);
        }
    }
    
    function showLoader(show, text = 'Carregando site...') {
        if (show) {
            loaderText.textContent = text;
            loaderOverlay.classList.add('active');
            setStatus('loading', 'Carregando...');
            if (loadTimeout) clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                if (loaderOverlay.classList.contains('active')) {
                    loaderText.textContent = 'Demorando mais que o normal...';
                    setProxyMessage('⏳ O proxy pode estar lento, aguarde...', 'error');
                }
            }, 8000);
        } else {
            loaderOverlay.classList.remove('active');
            setStatus('idle', 'Conectado');
            if (loadTimeout) {
                clearTimeout(loadTimeout);
                loadTimeout = null;
            }
        }
    }
    
    // ==================== TESTAR PROXY ====================
    async function testarProxy(proxyUrl) {
        try {
            const testUrl = proxyUrl + encodeURIComponent('https://httpbin.org/status/200');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            
            const response = await fetch(testUrl, { 
                mode: 'cors',
                signal: controller.signal 
            });
            clearTimeout(timeoutId);
            return response.ok;
        } catch(e) {
            return false;
        }
    }
    
    // ==================== CARREGAR URL ====================
    async function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        showLoader(true, `Conectando ao proxy...`);
        setProxyMessage(`🌐 Conectando a ${finalUrl}...`);
        currentUrl = finalUrl;
        urlInput.value = finalUrl;
        
        // Tentar encontrar proxy funcional
        let proxyFuncional = PROXY_SERVICE;
        let proxyTestado = false;
        
        // Só testar a cada 5 tentativas
        if (tentativasProxy % 5 === 0 && tentativasProxy > 0) {
            setProxyMessage(`🔍 Testando proxy...`, 'info');
            proxyTestado = true;
            const principalOk = await testarProxy(PROXY_SERVICE);
            if (!principalOk) {
                const backupOk = await testarProxy(PROXY_BACKUP);
                if (backupOk) {
                    proxyFuncional = PROXY_BACKUP;
                    setProxyMessage(`✅ Usando proxy alternativo`, 'success');
                } else {
                    setProxyMessage(`⚠️ Proxys lentos, tentando mesmo assim...`, 'error');
                }
            } else {
                setProxyMessage(`✅ Proxy principal OK`, 'success');
            }
        }
        
        const proxyUrl = proxyFuncional + encodeURIComponent(finalUrl);
        
        const loadHandler = () => {
            showLoader(false);
            setProxyMessage(`✅ Conectado a ${finalUrl.split('/')[2]}`, 'success');
            tentativasProxy = 0;
            iframe.removeEventListener('load', loadHandler);
            iframe.removeEventListener('error', errorHandler);
            setTimeout(() => {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }, 500);
        };
        
        const errorHandler = () => {
            showLoader(false);
            setStatus('error', 'Erro');
            setProxyMessage(`❌ Falha ao conectar. Tentando novamente...`, 'error');
            tentativasProxy++;
            
            // Tentar novamente com backup
            if (tentativasProxy < 3) {
                setTimeout(() => {
                    setProxyMessage(`🔄 Tentativa ${tentativasProxy + 1} de 3...`, 'info');
                    carregarUrl(finalUrl);
                }, 2000);
            } else {
                setProxyMessage(`❌ Não foi possível conectar a ${finalUrl}. Verifique o link.`, 'error');
                tentativasProxy = 0;
            }
            
            iframe.removeEventListener('load', loadHandler);
            iframe.removeEventListener('error', errorHandler);
        };
        
        iframe.removeEventListener('load', loadHandler);
        iframe.removeEventListener('error', errorHandler);
        iframe.addEventListener('load', loadHandler);
        iframe.addEventListener('error', errorHandler);
        
        iframe.src = proxyUrl;
        
        // Atualizar URL
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
    }
    
    function resetToHome() {
        carregarUrl(DEFAULT_URL);
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log('Erro fullscreen:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // ==================== EVENTOS ====================
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
        else carregarUrl(DEFAULT_URL);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    // ==================== INICIALIZAR ====================
    function init() {
        let startUrl = getUrlFromParams();
        if (!startUrl) startUrl = DEFAULT_URL;
        
        urlInput.value = startUrl;
        carregarUrl(startUrl);
        
        // Tentar anúncios várias vezes
        setTimeout(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 500);
        setTimeout(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 2000);
        setTimeout(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 5000);
    }
    
    window.addEventListener('popstate', (event) => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>

</body>
</html>
