        /* LOADER */
        .loader {

<body>

<!-- CABEÇALHO -->
<div class="proxy-header">

<!-- IFRAME -->
<div class="iframe-container" id="iframeContainer">
    <iframe id="proxyFrame" src="about:blank" title="Marujo Proxy"></iframe>

<!-- LOADER -->
<div class="loader" id="loader">
    <div class="spinner"></div>
    <span id="loaderText">Carregando site...</span>
</div>

<!-- MENSAGEM DE ERRO -->
<div id="errorMsg" class="error-message"></div>

<script>
    // ==================== CONFIGURAÇÃO ====================
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    
    let currentUrl = DEFAULT_URL;
    let loadTimeout = null;
    let tentativas = 0;
    
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const errorMsg = document.getElementById('errorMsg');
    
    // ==================== FUNÇÕES ====================
    function showLoader(show, text = 'Carregando site...') {
        if (show) {
            loaderText.textContent = text;
            loader.classList.add('show');
            if (loadTimeout) clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                if (loader.classList.contains('show')) {
                    showLoader(false);
                    showError('O site demorou para responder. Verifique o link e tente novamente.');
                }
            }, 12000);
        } else {
            loader.classList.remove('show');
            if (loadTimeout) {
                clearTimeout(loadTimeout);
                loadTimeout = null;
            }
        }
    }
    
    function showError(message) {
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
        setTimeout(() => {
            errorMsg.style.display = 'none';
        }, 4000);
    }
    
    function formatDisplayUrl(url) {
        try {
            let hostname = new URL(url).hostname;
            return hostname.replace('www.', '');
        } catch(e) {
            return url.substring(0, 40);
        }
    }
    
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        
        // Adicionar https:// se não tiver protocolo
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        showLoader(true, `Conectando a ${formatDisplayUrl(finalUrl)}...`);
        currentUrl = finalUrl;
        urlInput.value = finalUrl;
        
        const proxyUrl = PROXY_SERVICE + encodeURIComponent(finalUrl);
        
        // Handler de sucesso
        const onLoad = () => {
            showLoader(false);
            tentativas = 0;
            iframe.removeEventListener('load', onLoad);
            iframe.removeEventListener('error', onError);
            
            // Recarregar anúncios
            setTimeout(() => {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }, 500);
        };
        
        // Handler de erro
        const onError = () => {
            tentativas++;
            showLoader(false);
            showError(`Erro ao carregar ${formatDisplayUrl(finalUrl)}. ${tentativas < 3 ? 'Tentando novamente...' : 'Verifique o link.'}`);
            
            if (tentativas < 3) {
                setTimeout(() => {
                    carregarUrl(finalUrl);
                }, 2000);
            }
            
            iframe.removeEventListener('load', onLoad);
            iframe.removeEventListener('error', onError);
        };
        
        iframe.removeEventListener('load', onLoad);
        iframe.removeEventListener('error', onError);
        iframe.addEventListener('load', onLoad);
        iframe.addEventListener('error', onError);
        
        iframe.src = proxyUrl;
        
        // Atualizar URL da página
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
    }
    
    function resetToHome() {
        carregarUrl(DEFAULT_URL);
    }
    
    function toggleFullscreen() {
        const container = document.getElementById('iframeContainer');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                console.log('Erro fullscreen:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        return null;
    }
    
    // ==================== EVENTOS ====================
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    // ==================== INICIALIZAR ====================
    function init() {
        let startUrl = getUrlFromParams();
        if (!startUrl) startUrl = DEFAULT_URL;
        
        urlInput.value = startUrl;
        carregarUrl(startUrl);
        
        // Recarregar anúncios periodicamente
        setInterval(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }, 25000);
    }
    
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>
