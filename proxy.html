<!-- LOADER -->
<div id="loaderOverlay" class="loader-overlay">

<script>
    const PROXY_SERVICE = 'https://cors.eu.org/';
    const DEFAULT_URL = 'https://g1.globo.com/';
    
    let currentUrl = DEFAULT_URL;
    let loadTimeout = null;
    
    const iframe = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const statusText = document.getElementById('statusText');
    const loaderOverlay = document.getElementById('loaderOverlay');
    
    function showLoader(show) {
        if (show) {
            loaderOverlay.classList.add('active');
            statusText.textContent = 'Carregando...';
            if (loadTimeout) clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                if (loaderOverlay.classList.contains('active')) {
                    statusText.textContent = 'Demorando...';
                }
            }, 8000);
        } else {
            loaderOverlay.classList.remove('active');
            statusText.textContent = 'Conectado';
            if (loadTimeout) {
                clearTimeout(loadTimeout);
                loadTimeout = null;
            }
        }
    }
    
    function formatDomain(url) {
        try {
            let hostname = new URL(url).hostname;
            return hostname.replace('www.', '');
        } catch(e) {
            return 'site';
        }
    }
    
    function updateBarStatus(url) {
        urlInput.value = url;
        try {
            const domain = formatDomain(url);
            statusText.textContent = domain;
        } catch(e) {}
    }
    
    function carregarUrl(url) {
        if (!url) return;
        
        let finalUrl = url.trim();
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        
        showLoader(true);
        currentUrl = finalUrl;
        updateBarStatus(finalUrl);
        
        const proxyUrl = PROXY_SERVICE + encodeURIComponent(finalUrl);
        
        const loadHandler = () => {
            showLoader(false);
            iframe.removeEventListener('load', loadHandler);
            iframe.removeEventListener('error', errorHandler);
        };
        
        const errorHandler = () => {
            showLoader(false);
            statusText.textContent = 'Erro';
            iframe.removeEventListener('load', loadHandler);
            iframe.removeEventListener('error', errorHandler);
        };
        
        iframe.addEventListener('load', loadHandler);
        iframe.addEventListener('error', errorHandler);
        iframe.src = proxyUrl;
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('url', finalUrl);
        window.history.pushState({ url: finalUrl }, '', newUrl);
    }
    
    function resetToHome() {
        carregarUrl(DEFAULT_URL);
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log('Erro ao entrar em tela cheia:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    function getUrlFromParams() {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            return url;
        }
        
        try {
            const href = window.location.href;
            const questionIndex = href.indexOf('?');
            if (questionIndex !== -1) {
                let extracted = href.substring(questionIndex + 1);
                extracted = decodeURIComponent(extracted);
                if (extracted.startsWith('http://') || extracted.startsWith('https://')) {
                    return extracted;
                }
            }
        } catch(e) {}
        
        return null;
    }
    
    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) carregarUrl(url);
        else carregarUrl(DEFAULT_URL);
    });
    
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) carregarUrl(url);
        }
    });
    
    function init() {
        let startUrl = getUrlFromParams();
        if (!startUrl) startUrl = DEFAULT_URL;
        
        urlInput.value = startUrl;
        carregarUrl(startUrl);
    }
    
    window.addEventListener('popstate', (event) => {
        const params = new URLSearchParams(window.location.search);
        let url = params.get('url');
        if (url && url !== currentUrl) {
            carregarUrl(url);
        }
    });
    
    init();
</script>
