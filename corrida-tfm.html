<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Corrida TFM · Marujo Digital</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #030d1c;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e8f1ff;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #030d1c;
  }
  #ui {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 14px; gap: 8px;
  }
  .hud-box {
    background: rgba(6, 20, 40, 0.78);
    border: 1px solid rgba(158, 201, 255, 0.22);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .hud-box strong { color: #ffd76a; font-weight: 700; }
  #motto {
    position: absolute; top: 52px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255, 215, 106, 0.9);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #motto.show { opacity: 1; }
  #banner {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%) scale(0.92);
    background: rgba(8, 24, 48, 0.94);
    border: 1px solid rgba(255, 215, 106, 0.45);
    border-radius: 14px;
    padding: 16px 26px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    max-width: 90vw;
    z-index: 5;
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner h2 { font-size: 26px; color: #ffd76a; margin-bottom: 4px; }
  #banner p { font-size: 13px; color: #b8d4f0; }
  #controls {
    position: absolute; bottom: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 14px;
    pointer-events: none;
    z-index: 6;
  }
  .pad { display: flex; gap: 10px; pointer-events: auto; }
  .btn {
    width: 70px; height: 70px;
    border-radius: 18px;
    border: 1px solid rgba(158, 201, 255, 0.4);
    background: rgba(10, 30, 55, 0.85);
    color: #e8f1ff;
    font-size: 24px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    cursor: pointer;
  }
  .btn:active, .btn.held { background: rgba(40, 100, 180, 0.85); border-color: #ffd76a; }
  #btn-mute {
    position: absolute; top: 10px; right: 14px;
    width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid rgba(158, 201, 255, 0.3);
    background: rgba(6, 20, 40, 0.8);
    color: #cfe4ff;
    font-size: 16px;
    pointer-events: auto;
    cursor: pointer;
    z-index: 7;
  }
  #start-screen, #end-screen {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(3,13,28,0.97), rgba(10,40,70,0.95));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    pointer-events: auto;
    z-index: 10;
  }
  #start-screen h1, #end-screen h1 {
    font-size: 28px; color: #ffd76a; letter-spacing: 0.06em; margin-bottom: 8px;
  }
  #start-screen .sub {
    font-size: 13px; color: #9ec9ff; max-width: 360px; line-height: 1.5; margin-bottom: 16px;
  }
  #start-screen .verse {
    font-style: italic; color: rgba(255, 215, 106, 0.95); margin-bottom: 20px; font-size: 14px;
  }
  .cta {
    border: none;
    background: linear-gradient(180deg, #f0c14a, #c9921a);
    color: #1a1200;
    font-weight: 800;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
    box-shadow: 0 6px 20px rgba(240, 193, 74, 0.35);
  }
  .cta:active { transform: scale(0.98); }
  .cta.ghost {
    background: transparent; color: #9ec9ff;
    border: 1px solid rgba(158, 201, 255, 0.4);
    box-shadow: none; margin-top: 10px;
  }
  #end-screen { display: none; }
  #end-screen .stats { margin: 12px 0 20px; font-size: 14px; color: #b8d4f0; line-height: 1.7; }
  #end-screen .stats strong { color: #ffd76a; }
  .hint { margin-top: 16px; font-size: 12px; color: rgba(158, 201, 255, 0.7); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="480" tabindex="0"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="hud-box">⏱ <strong id="t-time">0.00</strong>s</div>
      <div class="hud-box">🏁 <strong id="t-prog">0</strong>%</div>
      <div class="hud-box" style="margin-right:48px">⭐ <strong id="t-best">—</strong></div>
    </div>
    <div id="motto">Guiados por Deus, ninguém me segura</div>
    <div id="banner"></div>
    <button type="button" id="btn-mute" title="Som">🔊</button>
    <div id="controls">
      <div class="pad">
        <button type="button" class="btn" id="btn-left" aria-label="Esquerda">◀</button>
        <button type="button" class="btn" id="btn-right" aria-label="Direita">▶</button>
      </div>
      <div class="pad">
        <button type="button" class="btn" id="btn-jump" aria-label="Pular">▲</button>
      </div>
    </div>
  </div>

  <div id="start-screen">
    <h1>CORRIDA TFM</h1>
    <p class="verse">“Guiados por Deus, ninguém me segura.”</p>
    <p class="sub">
      Corra, pule e não caia na água.<br>
      <b>Teclado:</b> ← → e Espaço/↑ &nbsp;·&nbsp; <b>Celular:</b> botões na tela.
    </p>
    <button type="button" class="cta" id="btn-start">EMBARCAR</button>
    <p class="hint">Canção de TFM · Marujo Digital</p>
  </div>

  <div id="end-screen">
    <h1 id="end-title">MISSÃO CUMPRIDA</h1>
    <div class="stats" id="end-stats"></div>
    <button type="button" class="cta" id="btn-again">CORRER DE NOVO</button>
    <button type="button" class="cta ghost" id="btn-close">FECHAR</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var IN_IFRAME = window.parent !== window;
  var MUSIC_SRC = '/Apitos/guiados-por-deus.mp3';
  var LS_BEST = 'md_corrida_tfm_best';
  var W = 900, H = 480;
  var GRAV = 2200;
  var RUN_ACC = 3400;
  var RUN_MAX = 340;
  var FRICTION = 2600;
  var JUMP_V = -640;
  var COYOTE = 0.1;
  var JUMP_BUF = 0.12;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var elTime = document.getElementById('t-time');
  var elProg = document.getElementById('t-prog');
  var elBest = document.getElementById('t-best');
  var elMotto = document.getElementById('motto');
  var elBanner = document.getElementById('banner');
  var startScreen = document.getElementById('start-screen');
  var endScreen = document.getElementById('end-screen');
  var btnMute = document.getElementById('btn-mute');

  var muted = localStorage.getItem('md_corrida_tfm_mute') === '1';
  var music = null;
  var best = parseFloat(localStorage.getItem(LS_BEST) || '0') || 0;
  if (best > 0) elBest.textContent = best.toFixed(2) + 's';
  btnMute.textContent = muted ? '🔇' : '🔊';

  var keys = { left: false, right: false, jump: false };
  var jumpPressed = false;
  var state = 'menu';
  var canControl = false;
  var raceTime = 0;
  var t = 0, camX = 0;
  var player = null;
  var solids = [], hazards = [], checkpoints = [];
  var finishX = 5000, spawn = { x: 80, y: 360 };
  var particles = [], floats = [];
  var lastCp = 0;
  var coyote = 0, jumpBuf = 0;
  var flash = 0;
  var mottoTimer = 0;
  var countdownTimers = [];

  function clearCountdowns() {
    for (var i = 0; i < countdownTimers.length; i++) clearTimeout(countdownTimers[i]);
    countdownTimers = [];
  }

  function setKey(k, v) {
    if (k === 'jump' && v && !keys.jump) jumpPressed = true;
    keys[k] = v;
  }

  window.addEventListener('keydown', function (e) {
    var code = e.code;
    if (code === 'ArrowLeft' || code === 'KeyA') { setKey('left', true); e.preventDefault(); }
    if (code === 'ArrowRight' || code === 'KeyD') { setKey('right', true); e.preventDefault(); }
    if (code === 'ArrowUp' || code === 'Space' || code === 'KeyW') {
      setKey('jump', true);
      e.preventDefault();
    }
    if (code === 'KeyM') toggleMute();
    if (state === 'menu' && (code === 'Enter' || code === 'Space')) {
      e.preventDefault();
      startRun();
    }
    if (state === 'win' && code === 'Enter') startRun();
  }, { passive: false });

  window.addEventListener('keyup', function (e) {
    var code = e.code;
    if (code === 'ArrowLeft' || code === 'KeyA') setKey('left', false);
    if (code === 'ArrowRight' || code === 'KeyD') setKey('right', false);
    if (code === 'ArrowUp' || code === 'Space' || code === 'KeyW') setKey('jump', false);
  });

  function bindPad(id, key) {
    var el = document.getElementById(id);
    function down(e) {
      e.preventDefault();
      e.stopPropagation();
      setKey(key, true);
      el.classList.add('held');
      try { canvas.focus(); } catch (err) {}
    }
    function up(e) {
      e.preventDefault();
      setKey(key, false);
      el.classList.remove('held');
    }
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
  }
  bindPad('btn-left', 'left');
  bindPad('btn-right', 'right');
  bindPad('btn-jump', 'jump');

  document.getElementById('btn-start').addEventListener('click', function (e) {
    e.preventDefault();
    startRun();
  });
  document.getElementById('btn-again').addEventListener('click', function (e) {
    e.preventDefault();
    startRun();
  });
  document.getElementById('btn-close').addEventListener('click', function () {
    if (IN_IFRAME) {
      try { parent.postMessage({ type: 'md-corrida-tfm', action: 'close' }, '*'); } catch (e) {}
    } else {
      endScreen.style.display = 'none';
      startScreen.style.display = 'flex';
      state = 'menu';
      stopMusic();
    }
  });
  btnMute.addEventListener('click', toggleMute);

  // click/tap canvas to focus + jump
  canvas.addEventListener('pointerdown', function () {
    try { canvas.focus(); } catch (e) {}
    if (state === 'play' && canControl) setKey('jump', true);
  });
  canvas.addEventListener('pointerup', function () {
    setKey('jump', false);
  });

  function ensureMusic() {
    if (music) return music;
    try {
      music = new Audio(MUSIC_SRC);
      music.loop = true;
      music.preload = 'auto';
      music.volume = 0.55;
    } catch (e) { music = null; }
    return music;
  }
  function playMusic() {
    if (muted) return;
    var m = ensureMusic();
    if (!m) return;
    try {
      m.currentTime = 0;
      var p = m.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  function stopMusic() {
    if (!music) return;
    try { music.pause(); music.currentTime = 0; } catch (e) {}
  }
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('md_corrida_tfm_mute', muted ? '1' : '0');
    btnMute.textContent = muted ? '🔇' : '🔊';
    if (muted) stopMusic();
    else if (state === 'play' && canControl) playMusic();
  }

  function rect(x, y, w, h, type) {
    return { x: x, y: y, w: w, h: h, type: type || 'solid' };
  }

  function buildLevel() {
    solids = [];
    hazards = [];
    checkpoints = [];

    solids.push(rect(0, 400, 420, 80));
    solids.push(rect(480, 400, 200, 80));
    solids.push(rect(300, 340, 50, 60));
    solids.push(rect(360, 300, 50, 100));

    solids.push(rect(760, 400, 280, 80));
    solids.push(rect(900, 320, 70, 20));
    solids.push(rect(1020, 280, 70, 20));
    solids.push(rect(1140, 400, 220, 80));
    solids.push(rect(1180, 360, 40, 40));
    solids.push(rect(1220, 360, 40, 40));
    solids.push(rect(1200, 320, 40, 40));

    solids.push(rect(1450, 400, 360, 80, 'ice'));
    solids.push(rect(1550, 320, 60, 16));
    solids.push(rect(1680, 280, 60, 16));
    solids.push(rect(1810, 400, 200, 80));

    solids.push(rect(2100, 400, 160, 80));
    solids.push(rect(2320, 360, 80, 16));
    solids.push(rect(2460, 300, 80, 16));
    solids.push(rect(2600, 240, 80, 16));
    solids.push(rect(2740, 300, 80, 16));
    solids.push(rect(2880, 400, 260, 80));

    solids.push(rect(3200, 400, 120, 80));
    solids.push(rect(3380, 360, 50, 120));
    solids.push(rect(3480, 300, 50, 180));
    solids.push(rect(3580, 360, 50, 120));
    solids.push(rect(3700, 400, 300, 80));

    solids.push(rect(4100, 400, 180, 80));
    solids.push(rect(4340, 360, 70, 20));
    solids.push(rect(4480, 300, 70, 20));
    solids.push(rect(4620, 400, 500, 80));
    solids.push(rect(4900, 340, 20, 60));
    solids.push(rect(5080, 340, 20, 60));

    hazards.push(rect(420, 430, 60, 50));
    hazards.push(rect(680, 430, 80, 50));
    hazards.push(rect(1360, 430, 90, 50));
    hazards.push(rect(2010, 430, 90, 50));
    hazards.push(rect(2260, 430, 60, 50));
    hazards.push(rect(2540, 430, 60, 50));
    hazards.push(rect(2820, 430, 60, 50));
    hazards.push(rect(3140, 430, 60, 50));
    hazards.push(rect(4000, 430, 100, 50));
    hazards.push(rect(4280, 430, 60, 50));
    hazards.push(rect(4410, 430, 70, 50));
    hazards.push(rect(4550, 430, 70, 50));

    checkpoints = [
      { x: 50, y: 400, id: 0 },
      { x: 900, y: 400, id: 1 },
      { x: 1850, y: 400, id: 2 },
      { x: 2950, y: 400, id: 3 },
      { x: 3750, y: 400, id: 4 }
    ];
    finishX = 5000;
    spawn = { x: 80, y: 350 };
  }

  function makePlayer(x, y) {
    return {
      x: x, y: y, w: 28, h: 40,
      vx: 0, vy: 0,
      onGround: false,
      facing: 1,
      anim: 0,
      invuln: 0
    };
  }

  function showBanner(title, sub) {
    elBanner.innerHTML = '<h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '');
    elBanner.classList.add('show');
  }
  function hideBanner() { elBanner.classList.remove('show'); }

  function startRun() {
    clearCountdowns();
    buildLevel();
    player = makePlayer(spawn.x, spawn.y);
    lastCp = 0;
    raceTime = 0;
    camX = 0;
    particles = [];
    floats = [];
    coyote = 0;
    jumpBuf = 0;
    canControl = false;
    keys.left = keys.right = keys.jump = false;
    jumpPressed = false;
    state = 'play';

    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    elMotto.classList.add('show');
    mottoTimer = 4;
    flash = 0.35;

    try { canvas.focus(); } catch (e) {}

    showBanner('3', 'Vibra, tropa!');
    countdownTimers.push(setTimeout(function () { if (state === 'play') showBanner('2', ''); }, 700));
    countdownTimers.push(setTimeout(function () { if (state === 'play') showBanner('1', ''); }, 1400));
    countdownTimers.push(setTimeout(function () {
      if (state !== 'play') return;
      showBanner('EMBARQUE!', 'Guiados por Deus…');
      canControl = true;
      playMusic();
    }, 2100));
    countdownTimers.push(setTimeout(function () {
      if (state === 'play') hideBanner();
    }, 3000));
  }

  function floatText(x, y, text, color) {
    floats.push({ x: x, y: y, text: text, color: color || '#ffd76a', life: 1.2 });
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 2,
        life: 0.4 + Math.random() * 0.4,
        color: color,
        s: 2 + Math.random() * 3
      });
    }
  }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function resolve(p, horizontal) {
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (!aabb(p, s)) continue;
      if (horizontal) {
        if (p.vx > 0) p.x = s.x - p.w;
        else if (p.vx < 0) p.x = s.x + s.w;
        p.vx = 0;
      } else {
        if (p.vy > 0) {
          p.y = s.y - p.h;
          p.vy = 0;
          p.onGround = true;
        } else if (p.vy < 0) {
          p.y = s.y + s.h;
          p.vy = 0;
        }
      }
    }
  }

  function movePlayer(dt) {
    if (!player) return;
    var p = player;

    var want = 0;
    if (canControl) {
      if (keys.left) want -= 1;
      if (keys.right) want += 1;
    }
    if (want !== 0) p.facing = want;

    var onIce = false;
    if (p.onGround) {
      for (var i = 0; i < solids.length; i++) {
        var s = solids[i];
        if (s.type === 'ice' &&
            Math.abs((p.y + p.h) - s.y) < 3 &&
            p.x + p.w > s.x && p.x < s.x + s.w) {
          onIce = true;
          break;
        }
      }
    }

    if (want !== 0) {
      p.vx += want * RUN_ACC * dt;
      var max = onIce ? RUN_MAX * 1.2 : RUN_MAX;
      if (p.vx > max) p.vx = max;
      if (p.vx < -max) p.vx = -max;
    } else {
      var fr = onIce ? FRICTION * 0.2 : FRICTION;
      if (p.vx > 0) { p.vx -= fr * dt; if (p.vx < 0) p.vx = 0; }
      if (p.vx < 0) { p.vx += fr * dt; if (p.vx > 0) p.vx = 0; }
    }

    if (p.onGround) coyote = COYOTE;
    else coyote -= dt;

    if (canControl) {
      if (jumpPressed || keys.jump) jumpBuf = JUMP_BUF;
      else jumpBuf -= dt;
    } else {
      jumpBuf = 0;
    }
    jumpPressed = false;

    if (jumpBuf > 0 && coyote > 0) {
      p.vy = JUMP_V;
      p.onGround = false;
      coyote = 0;
      jumpBuf = 0;
      burst(p.x + p.w / 2, p.y + p.h, '#9ec9ff', 6);
    }
    if (!keys.jump && p.vy < -200) p.vy += 900 * dt;

    p.vy += GRAV * dt;
    if (p.vy > 1200) p.vy = 1200;

    p.x += p.vx * dt;
    resolve(p, true);
    p.y += p.vy * dt;
    p.onGround = false;
    resolve(p, false);

    for (i = 0; i < hazards.length; i++) {
      if (aabb(p, hazards[i])) {
        drown();
        return;
      }
    }
    if (p.y > H + 60) {
      drown();
      return;
    }

    for (i = 0; i < checkpoints.length; i++) {
      var cp = checkpoints[i];
      if (cp.id > lastCp && p.x + p.w > cp.x && p.x < cp.x + 24) {
        lastCp = cp.id;
        spawn = { x: cp.x, y: cp.y - p.h - 2 };
        floatText(cp.x, cp.y - 40, 'CHECKPOINT', '#2ecc71');
        burst(cp.x + 10, cp.y - 10, '#2ecc71', 10);
      }
    }

    if (p.x + p.w >= finishX) win();

    p.anim += dt * (Math.abs(p.vx) > 40 ? 12 : 4);
    if (p.invuln > 0) p.invuln -= dt;
  }

  function drown() {
    if (state !== 'play' || !player) return;
    burst(player.x + player.w / 2, player.y + player.h, '#4fc3f7', 16);
    floatText(player.x, player.y, 'HOMEM AO MAR!', '#ff6b6b');
    flash = 0.3;
    state = 'dead';
    setTimeout(function () {
      if (state !== 'dead') return;
      player = makePlayer(spawn.x, spawn.y);
      player.invuln = 1.0;
      state = 'play';
    }, 650);
  }

  function win() {
    if (state !== 'play') return;
    state = 'win';
    canControl = false;
    stopMusic();
    var time = Math.max(0, raceTime);
    var isBest = !best || time < best;
    if (isBest) {
      best = time;
      localStorage.setItem(LS_BEST, String(best));
      elBest.textContent = best.toFixed(2) + 's';
    }
    var xp = 40;
    if (time < 45) xp += 30;
    else if (time < 60) xp += 20;
    else if (time < 90) xp += 10;
    if (isBest) xp += 15;

    document.getElementById('end-title').textContent = isBest ? 'RECORDE PESSOAL!' : 'MISSÃO CUMPRIDA';
    document.getElementById('end-stats').innerHTML =
      'Tempo: <strong>' + time.toFixed(2) + 's</strong><br>' +
      (isBest ? 'Novo recorde na pista!<br>' : 'Melhor: <strong>' + best.toFixed(2) + 's</strong><br>') +
      'XP ganho: <strong>+' + xp + '</strong>';
    endScreen.style.display = 'flex';

    try {
      if (IN_IFRAME) {
        parent.postMessage({ type: 'md-corrida-tfm', action: 'xp', detail: { xpGained: xp, time: time, best: isBest } }, '*');
        parent.postMessage({ type: 'md-corrida-tfm', action: 'over', detail: { xpGained: xp, time: time } }, '*');
      }
      if (typeof window.mdGrantGameXp === 'function') {
        window.mdGrantGameXp({ xpGained: xp }, 'md-corrida-tfm');
      }
    } catch (e) {}
  }

  function drawRecruit(x, y, p) {
    ctx.save();
    ctx.translate(x + p.w / 2, y + p.h);
    if (p.facing < 0) ctx.scale(-1, 1);

    var run = Math.abs(p.vx) > 40 && p.onGround;
    var leg = run ? Math.sin(p.anim) * 7 : 0;
    var arm = run ? Math.sin(p.anim) * 6 : 0;

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-11, -8 + leg, 9, 8);
    ctx.fillRect(2, -8 - leg, 9, 8);

    ctx.fillStyle = '#3d5c3a';
    ctx.fillRect(-10, -22, 8, 16);
    ctx.fillRect(2, -22, 8, 16);

    ctx.fillStyle = '#4a6b45';
    ctx.fillRect(-12, -40, 24, 20);
    ctx.fillStyle = '#2c2c2c';
    ctx.fillRect(-12, -22, 24, 4);
    ctx.fillStyle = '#ff9800';
    ctx.fillRect(-12, -36, 24, 3);

    ctx.fillStyle = '#4a6b45';
    ctx.fillRect(-16, -38 + arm * 0.3, 6, 16);
    ctx.fillRect(10, -38 - arm * 0.3, 6, 16);
    ctx.fillStyle = '#c68642';
    ctx.fillRect(-16, -24 + arm * 0.3, 6, 5);
    ctx.fillRect(10, -24 - arm * 0.3, 6, 5);

    ctx.fillStyle = '#c68642';
    ctx.beginPath();
    ctx.arc(0, -48, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2d4a28';
    ctx.beginPath();
    ctx.arc(0, -50, 10, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-10, -52, 20, 5);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(1, -50, 2.5, 2.5);

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#061525');
    g.addColorStop(0.55, '#0a2a4a');
    g.addColorStop(1, '#0c4a5e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(200,230,255,0.35)';
    for (var i = 0; i < 40; i++) {
      var sx = ((i * 97 + 30) - camX * 0.15) % W;
      if (sx < 0) sx += W;
      ctx.fillRect(sx, (i * 37) % (H * 0.45), 2, 2);
    }

    ctx.fillStyle = '#0a3d5c';
    ctx.fillRect(0, 430, W, H - 430);
    ctx.fillStyle = 'rgba(79, 195, 247, 0.28)';
    for (i = 0; i < 12; i++) {
      var wx = ((i * 90) - camX * 0.5 + t * 30) % (W + 90) - 45;
      ctx.beginPath();
      ctx.ellipse(wx, 438 + Math.sin(t * 2 + i) * 2, 28, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    for (i = 0; i < solids.length; i++) {
      var s = solids[i];
      var sx2 = s.x - camX;
      if (sx2 + s.w < -40 || sx2 > W + 40) continue;
      if (s.type === 'ice') {
        ctx.fillStyle = '#5dade2';
        ctx.fillRect(sx2, s.y, s.w, s.h);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(sx2, s.y, s.w, 6);
      } else {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(sx2, s.y, s.w, s.h);
        ctx.fillStyle = '#1a252f';
        ctx.fillRect(sx2, s.y, s.w, 6);
        ctx.fillStyle = 'rgba(180,200,220,0.25)';
        for (var r = 8; r < s.w; r += 24) {
          ctx.beginPath();
          ctx.arc(sx2 + r, s.y + 12, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    var fx = finishX - camX;
    if (fx > -40 && fx < W + 40) {
      ctx.fillStyle = '#ffd76a';
      ctx.fillRect(fx, 280, 6, 120);
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.moveTo(fx + 6, 280);
      ctx.lineTo(fx + 50, 300);
      ctx.lineTo(fx + 6, 320);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('CHEGADA', fx - 10, 270);
    }

    for (i = 0; i < checkpoints.length; i++) {
      var cp = checkpoints[i];
      var cx = cp.x - camX;
      if (cx < -20 || cx > W + 20) continue;
      ctx.strokeStyle = cp.id <= lastCp ? '#2ecc71' : 'rgba(158,201,255,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cp.y);
      ctx.lineTo(cx, cp.y - 50);
      ctx.stroke();
      ctx.fillStyle = cp.id <= lastCp ? '#2ecc71' : '#9ec9ff';
      ctx.beginPath();
      ctx.moveTo(cx, cp.y - 50);
      ctx.lineTo(cx + 22, cp.y - 40);
      ctx.lineTo(cx, cp.y - 30);
      ctx.fill();
    }

    if (player && (player.invuln <= 0 || Math.floor(t * 12) % 2 === 0)) {
      drawRecruit(player.x - camX, player.y, player);
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.016;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - camX, pt.y, pt.s, pt.s);
      ctx.globalAlpha = 1;
    }
    for (i = floats.length - 1; i >= 0; i--) {
      var ft = floats[i];
      ft.y -= 0.5;
      ft.life -= 0.016;
      if (ft.life <= 0) { floats.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x - camX, ft.y);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Draw menu background so canvas is never empty
  function drawMenuBg() {
    buildLevel();
    player = makePlayer(spawn.x, spawn.y);
    camX = 0;
    draw();
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;
    if (flash > 0) flash -= dt;
    if (mottoTimer > 0) {
      mottoTimer -= dt;
      if (mottoTimer <= 0) elMotto.classList.remove('show');
    }

    try {
      if (state === 'play' || state === 'dead') {
        if (state === 'play') {
          movePlayer(dt);
          if (canControl) raceTime += dt;
          var target = player.x - W * 0.35;
          camX += (target - camX) * Math.min(1, 6 * dt);
          if (camX < 0) camX = 0;
          var maxCam = finishX - W * 0.55;
          if (camX > maxCam) camX = Math.max(0, maxCam);
          elTime.textContent = raceTime.toFixed(2);
          var prog = Math.max(0, Math.min(100, (player.x / finishX) * 100));
          elProg.textContent = String(Math.floor(prog));
        }
        draw();
      } else if (state === 'menu') {
        // idle parallax
        camX = (Math.sin(t * 0.15) * 0.5 + 0.5) * 200;
        if (!solids.length) buildLevel();
        if (!player) player = makePlayer(spawn.x, spawn.y);
        draw();
      } else if (state === 'win') {
        draw();
      }
    } catch (err) {
      console.error('[Corrida TFM]', err);
    }

    requestAnimationFrame(frame);
  }

  // boot
  drawMenuBg();
  requestAnimationFrame(frame);
  window.mdCorridaTfm = { start: startRun, mute: toggleMute };
})();
</script>
